<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bisma | Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{
            background:#f4f1ed;
        }
        .container{
            display:flex;
            height:100vh;
        }
        .left{
            flex:1;
            display:flex;
            flex-direction:column;
            justify-content:center;
            padding:80px;
            background:#f4f1ed;
        }
        .left h1{
            font-size:28px;
            font-weight:400;
            color:#444;
        }
        .left h2{
            font-size:48px;
            font-weight:700;
            margin:10px 0;
            color:#111;
        }
        .left h3{
            font-size:22px;
            font-weight:500;
            color:#4cf23a;
            margin-bottom:20px;
        }
        .left p{
            font-size:15px;
            color:#666;
            line-height:1.8;
            max-width:500px;
            margin-bottom:30px;
        }
        .button{
            width:180px;
            padding:12px 20px;
            background:#309a24;
            color:white;
            border:none;
            border-radius:30px;
            font-size:14px;
            cursor:pointer;
            transition:0.3s ease;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .button:hover{
            background:#111;
            transform:translateY(-3px);
        }


        .right{
            flex:1;
            position:relative;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#111;
        }
        .right img{
            width:100%;
            height: 100%;
            object-fit:cover;
            box-shadow:0 20px 40px rgba(0,0,0,0.3);
        }

        .social{
            position:absolute;
            right:20px;
            display:flex;
            flex-direction:column;
            gap:20px;
        }
        .social a{
            color:#f4f1ed;
            font-size:18px;
            transition:0.3s;
        }
        .social a:hover{
            color:#4cf23a;
            transform:scale(1.2);
        }

    </style>
</head>
<body>

<div class="container">

    <div class="left">
        <h1>Hey There</h1>
        <h2>I'M HAFSA</h2>
        <h3>Web Developer</h3>
        <p>
            I build clean, modern and user-focused websites. Passionate about turning ideas 
            into digital experiences that feel smooth, fast and aesthetic. 
            Currently learning, building and leveling up every single day.
        </p>
        <a href="http://127.0.0.1:5500/portfolio2.html#" class="button"><b>About Me</b></a>
    </div>


    <div class="right">
        <img src="orig.webp" alt="Profile Image">

        <div class="social">
            <a href="#"><i class="fab fa-linkedin-in"></i></a>
            <a href="#"><i class="fab fa-github"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
        </div>
    </div>

</div>

</body>
</html>
